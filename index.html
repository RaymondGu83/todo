<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To-Do Tracker</title>
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="To-Do">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 2.5em 1em;
    min-height: 100vh;
    color: #1e293b;
    background: linear-gradient(135deg, #eef2ff 0%, #f5f3ff 50%, #fdf2f8 100%);
    background-attachment: fixed;
  }
  .card {
    max-width: 860px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    padding: 2em;
    box-shadow: 0 10px 40px rgba(79, 70, 229, 0.12);
  }
  h1 {
    margin: 0;
    text-align: center;
    font-size: 1.8em;
    background: linear-gradient(90deg, #16a34a, #22c55e);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .header { position: relative; display: flex; justify-content: center; align-items: center; margin-bottom: 0.8em; }
  .header #themeBtn { position: absolute; right: 0; top: 50%; transform: translateY(-50%); }
  #themeBtn {
    border: none;
    background: #f1f5f9;
    border-radius: 999px;
    width: 40px;
    height: 40px;
    font-size: 1.2em;
    cursor: pointer;
  }

  /* progress */
  .stats { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 0.9em; color: #64748b; margin-bottom: 6px; min-height: 32px; }
  .bar { height: 8px; background: #e2e8f0; border-radius: 999px; overflow: hidden; margin-bottom: 1.5em; }
  #barFill { height: 100%; width: 0; background: linear-gradient(90deg, #4f46e5, #db2777); border-radius: 999px; transition: width .3s ease; }

  /* forms */
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  #form { margin-bottom: 1.5em; }
  input, select {
    font: inherit;
    padding: 10px 12px;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    background: #f8fafc;
    color: inherit;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    background: #fff;
  }
  /* date inputs: native text hidden, overlay shows e.g. "21 Nov 2026" */
  .dwrap { position: relative; display: flex; }
  .dwrap input { color: transparent; }
  .dwrap .dfmt { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); pointer-events: none; white-space: nowrap; }
  .dwrap .dfmt.empty { opacity: .5; }
  #form input, #form select { padding: 6px 10px; font-size: 0.92em; }
  #form .primary { padding: 6px 18px; font-size: 0.92em; }
  #form { gap: 6px; }
  #item { flex: 1 1 160px; }
  #requestedBy { flex: 1 1 110px; min-width: 0; }
  #notes { flex: 2 1 160px; min-width: 0; }
  .primary {
    font: inherit;
    font-weight: 600;
    padding: 10px 22px;
    border: none;
    border-radius: 10px;
    color: #fff;
    cursor: pointer;
    background: linear-gradient(90deg, #4f46e5, #7c3aed);
    transition: transform .1s, box-shadow .15s;
  }
  .primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35); }
  button.tool {
    font: inherit;
    font-size: 0.85em;
    border: 1px solid #e2e8f0;
    background: #f8fafc;
    color: #475569;
    border-radius: 10px;
    padding: 8px 14px;
    cursor: pointer;
  }
  button.tool:hover { background: #e0e7ff; }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1em; }
  .toolbar input[type=search] { flex: 1 1 200px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .chip {
    font: inherit; font-size: 0.85em; cursor: pointer;
    padding: 8px 14px; border-radius: 999px;
    border: 1px solid #e2e8f0; background: #f8fafc; color: #475569;
    transition: background .15s, color .15s, border-color .15s;
  }
  .chip:hover { background: #e0e7ff; }
  .chip.active { background: linear-gradient(135deg, #4f46e5, #7c3aed); border-color: transparent; color: #fff; font-weight: 600; }
  body.dark .chip { background: #0f172a; border-color: #334155; color: #cbd5e1; }
  body.dark .chip:hover { background: #334155; }
  body.dark .chip.active { background: linear-gradient(135deg, #6366f1, #8b5cf6); border-color: transparent; color: #fff; }
  .toolbar select { flex: 0 1 auto; }

  /* table */
  table { width: 100%; border-collapse: collapse; }
  th {
    font-size: 0.75em;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #64748b;
    text-align: left;
    padding: 8px 10px;
    border-bottom: 2px solid #e2e8f0;
  }
  td { padding: 12px 10px; border-bottom: 1px solid #f1f5f9; }
  tbody tr { touch-action: manipulation; }
  tbody tr:hover { background: #f5f3ff; }
  tr.group td {
    padding: 14px 10px 6px;
    font-size: 0.78em;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #4f46e5;
    cursor: pointer;
    user-select: none;
    border-bottom: none;
  }
  tr.group:hover { background: transparent; }
  tr.group.overdue td { color: #dc2626; }
  .notes { font-size: 0.85em; color: #64748b; margin-top: 2px; font-weight: normal; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: #4f46e5; cursor: pointer; padding: 0; }
  td button {
    border: none;
    background: #f1f5f9;
    border-radius: 8px;
    padding: 6px 8px;
    margin-right: 4px;
    cursor: pointer;
    transition: background .15s;
  }
  td button:hover { background: #e0e7ff; }
  .badge {
    display: inline-block;
    padding: 3px 12px;
    border-radius: 999px;
    font-size: 0.8em;
    font-weight: 600;
  }
  .badge.High { background: #fee2e2; color: #b91c1c; }
  .badge.Medium { background: #fef3c7; color: #b45309; }
  .badge.Low { background: #dcfce7; color: #15803d; }
  td.overdue { color: #dc2626; font-weight: 600; }
  td.today { color: #d97706; font-weight: 600; }
  tr.done td { color: #94a3b8; text-decoration: line-through; }
  tr.done td:first-child, tr.done td:last-child { text-decoration: none; }
  tr.done td.overdue, tr.done td.today { color: #94a3b8; font-weight: normal; }
  tr.done .notes { color: #94a3b8; }

  /* animations */
  @keyframes enter { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  tr.enter { animation: enter .35s ease; }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
  ::view-transition-group(*) { animation-duration: .25s; }
  @media (prefers-reduced-motion: reduce) {
    tr.enter, #toast { animation: none; }
    #barFill { transition: none; }
  }

  .empty { text-align: center; padding: 2.5em 1em; color: #64748b; font-size: 1.05em; }
  .empty b { display: block; font-size: 1.3em; margin-bottom: 4px; color: inherit; }
  .backup { display: flex; gap: 8px; justify-content: center; margin-top: 1.5em; flex-wrap: wrap; }
  .hint { text-align: center; font-size: 0.78em; color: #94a3b8; margin-top: 1em; }
  kbd { font: inherit; font-size: 0.95em; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 4px; padding: 0 5px; }

  /* edit dialog */
  dialog {
    border: none;
    border-radius: 16px;
    padding: 1.5em;
    width: min(440px, calc(100% - 2em));
    background: #fff;
    color: #1e293b;
    box-shadow: 0 20px 60px rgba(15, 23, 42, 0.35);
  }
  dialog::backdrop { background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(2px); }
  dialog h2 { margin: 0 0 1em; font-size: 1.2em; }
  #editForm { flex-direction: column; }
  #editForm input, #editForm select { width: 100%; }
  .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }

  /* undo toast */
  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(20px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 14px;
    background: #1e293b;
    color: #fff;
    padding: 12px 16px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    font-size: 0.95em;
    z-index: 100;
    animation: toastIn .25s ease;
    max-width: calc(100% - 24px);
  }
  #toast button { font: inherit; font-weight: 700; border: none; background: none; color: #a5b4fc; cursor: pointer; padding: 4px 6px; }

  /* Dark mode */
  body.dark { color: #e2e8f0; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #2e1065 100%); background-attachment: fixed; }
  body.dark .card { background: #1e293b; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); }
  body.dark input, body.dark select { background: #0f172a; border-color: #334155; color: #e2e8f0; }
  body.dark input:focus, body.dark select:focus { background: #0f172a; border-color: #818cf8; }
  body.dark input[type=date] { color-scheme: dark; }
  body.dark .dwrap input { color: transparent; }
  body.dark .dwrap .dfmt { color: #e2e8f0; }
  body.dark th { color: #94a3b8; border-bottom-color: #334155; }
  body.dark td { border-bottom-color: #334155; }
  body.dark tbody tr:hover { background: #273449; }
  body.dark td button, body.dark #themeBtn { background: #334155; }
  body.dark td button:hover { background: #475569; }
  body.dark .badge.High { background: #7f1d1d; color: #fecaca; }
  body.dark .badge.Medium { background: #78350f; color: #fde68a; }
  body.dark .badge.Low { background: #14532d; color: #bbf7d0; }
  body.dark tr.done td, body.dark tr.done .notes { color: #64748b; }
  body.dark td.overdue { color: #f87171; }
  body.dark td.today { color: #fbbf24; }
  body.dark tr.done td.overdue, body.dark tr.done td.today { color: #64748b; }
  body.dark tr.group td { color: #a5b4fc; }
  body.dark tr.group.overdue td { color: #f87171; }
  body.dark .notes, body.dark .stats, body.dark .empty { color: #94a3b8; }
  body.dark .bar { background: #334155; }
  body.dark button.tool { background: #0f172a; border-color: #334155; color: #cbd5e1; }
  body.dark button.tool:hover { background: #334155; }
  body.dark kbd { background: #0f172a; border-color: #334155; }
  body.dark dialog { background: #1e293b; color: #e2e8f0; }
  body.dark #toast { background: #e2e8f0; color: #0f172a; }
  body.dark #toast button { color: #4f46e5; }

  @media (hover: none) { .hint { display: none; } }

  /* Mobile / iPhone */
  @media (max-width: 640px) {
    body { padding: 1em 0.75em; padding-bottom: calc(5em + env(safe-area-inset-bottom)); }
    .card { padding: 1.25em 1em; border-radius: 14px; }
    h1 { font-size: 1.5em; }

    .dwrap { width: 100%; }
    form input, form select, .primary { width: 100%; min-height: 44px; font-size: 16px; }
    #form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    #form > * { min-width: 0; }
    #item { grid-column: 1; grid-row: 1; flex: none; }
    #submitBtn { grid-column: 2; grid-row: 1; }
    #priority { grid-column: 1; grid-row: 2; }
    #form .dwrap, #deadline { grid-column: 2; grid-row: 2; }
    #requestedBy { grid-column: 1; grid-row: 3; flex: none; }
    #notes { grid-column: 2; grid-row: 3; flex: none; }
    input[type=date] { -webkit-appearance: none; appearance: none; min-width: 0; text-align: left; }
    .toolbar { flex-direction: column; }
    .toolbar input, .toolbar select, .toolbar input[type=search] { width: 100%; min-height: 44px; font-size: 16px; flex: none; }
    button.tool { min-height: 44px; }
    .chip { min-height: 44px; flex: 1; padding: 8px 10px; }
    .chips { flex-wrap: nowrap; }
    .dialog-actions .primary, .dialog-actions .tool { width: auto; flex: 1; }

    /* table becomes a list of cards */
    table, tbody { display: block; }
    thead { display: none; }
    tr {
      display: grid;
      grid-template-columns: auto 1fr auto;
      column-gap: 12px;
      row-gap: 4px;
      align-items: center;
      padding: 14px 4px;
      border-bottom: 1px solid #f1f5f9;
    }
    body.dark tr { border-bottom-color: #334155; }
    td { display: block; padding: 0; border: none; }
    td:empty { display: none; }
    td:nth-child(1) { grid-column: 1; grid-row: 1 / span 4; align-self: start; padding-top: 2px; }
    td:nth-child(2) { grid-column: 2; font-weight: 600; font-size: 1.05em; word-break: break-word; }
    td:nth-child(3) { grid-column: 2; }
    td:nth-child(4) { grid-column: 2; font-size: 0.9em; color: #64748b; }
    td:nth-child(5) { grid-column: 2; font-size: 0.9em; color: #64748b; }
    td:nth-child(4)::before { content: "Due: "; }
    td:nth-child(5)::before { content: "From: "; }
    td:nth-child(6) { grid-column: 3; grid-row: 1 / span 4; display: flex; flex-direction: column; gap: 8px; align-self: start; }
    body.dark td:nth-child(4), body.dark td:nth-child(5) { color: #94a3b8; }
    tbody tr:hover { background: transparent; }
    td:nth-child(4).overdue { color: #dc2626; }
    td:nth-child(4).today { color: #d97706; }
    body.dark td:nth-child(4).overdue { color: #f87171; }
    body.dark td:nth-child(4).today { color: #fbbf24; }

    /* group headers on mobile */
    tr.group { display: block; padding: 10px 4px 0; border-bottom: none; }
    tr.group td { display: block; padding: 4px 0; grid-column: auto; grid-row: auto; font-size: 0.78em; color: #4f46e5; }
    tr.group td::before { content: none; }
    tr.group.overdue td { color: #dc2626; }
    body.dark tr.group td { color: #a5b4fc; }
    body.dark tr.group.overdue td { color: #f87171; }

    input[type=checkbox] { width: 26px; height: 26px; }
    td button { width: 44px; height: 44px; margin: 0; font-size: 1.2em; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>To-Do Tracker</h1>
    <button id="themeBtn" title="Toggle dark mode">🌙</button>
  </div>

  <div class="stats">
    <span id="statText"></span>
    <button type="button" class="tool" id="clearDone" hidden>Clear completed</button>
  </div>
  <div class="bar"><div id="barFill"></div></div>

  <form id="form">
    <input id="item" placeholder="Item" required autocomplete="off">
    <select id="priority" title="Priority">
      <option>High</option>
      <option selected>Medium</option>
      <option>Low</option>
    </select>
    <input id="deadline" type="date" title="Deadline">
    <input id="requestedBy" placeholder="Requested by" list="people" autocomplete="off">
    <input id="notes" placeholder="Notes (optional)" autocomplete="off">
    <button class="primary" id="submitBtn">Add</button>
  </form>
  <datalist id="people"></datalist>

  <div class="toolbar">
    <input id="search" type="search" placeholder="🔍 Search item, notes or requester">
    <div class="chips" data-for="filterPriority" role="group" aria-label="Filter by priority">
      <input type="hidden" id="filterPriority" value="">
      <button type="button" class="chip active" data-v="">All</button>
      <button type="button" class="chip" data-v="High">High</button>
      <button type="button" class="chip" data-v="Medium">Medium</button>
      <button type="button" class="chip" data-v="Low">Low</button>
    </div>
    <div class="chips" data-for="filterStatus" role="group" aria-label="Filter by status">
      <input type="hidden" id="filterStatus" value="">
      <button type="button" class="chip active" data-v="">All</button>
      <button type="button" class="chip" data-v="open">Open</button>
      <button type="button" class="chip" data-v="done">Done</button>
    </div>
    <select id="sortBy" title="Sort by">
      <option value="deadline">Sort: Deadline</option>
      <option value="priority">Sort: Priority</option>
      <option value="added">Sort: Date added</option>
    </select>
    <select id="groupBy" title="Group by">
      <option value="none">No grouping</option>
      <option value="due">Group: Due date</option>
      <option value="requester">Group: Requested by</option>
    </select>
  </div>

  <div id="empty" class="empty" hidden></div>

  <table id="table">
    <thead>
      <tr><th>Done</th><th>Item</th><th>Priority</th><th>Deadline</th><th>Requested by</th><th></th></tr>
    </thead>
    <tbody id="list"></tbody>
  </table>

  <div class="backup">
    <button type="button" class="tool" id="exportBtn">⬇️ Export backup</button>
    <button type="button" class="tool" id="importBtn">⬆️ Import backup</button>
    <input id="importFile" type="file" accept="application/json,.json" hidden>
  </div>
  <div class="hint"><kbd>N</kbd> new task · <kbd>/</kbd> search · <kbd>Esc</kbd> clear search · double-click a row to edit</div>
</div>

<dialog id="editDialog">
  <h2>Edit task</h2>
  <form id="editForm">
    <input id="eItem" placeholder="Item" required autocomplete="off">
    <select id="ePriority" title="Priority">
      <option>High</option>
      <option>Medium</option>
      <option>Low</option>
    </select>
    <input id="eDeadline" type="date" title="Deadline">
    <input id="eRequestedBy" placeholder="Requested by" list="people" autocomplete="off">
    <input id="eNotes" placeholder="Notes (optional)" autocomplete="off">
    <div class="dialog-actions">
      <button type="button" class="tool" id="eCancel">Cancel</button>
      <button class="primary">Save</button>
    </div>
  </form>
</dialog>

<div id="toast" hidden><span id="toastMsg"></span><button type="button" id="toastUndo">Undo</button></div>

<script>
const $ = id => document.getElementById(id);

// ---------- storage (falls back to memory if the browser blocks localStorage) ----------
const store = {
  mem: {},
  get(k) { try { return localStorage.getItem(k); } catch (e) { return this.mem[k] ?? null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { this.mem[k] = v; } }
};

let tasks = [];
try {
  const d = JSON.parse(store.get("tasks") || "[]");
  if (Array.isArray(d)) tasks = d;
} catch (e) {}

let nextId = 1;
function ensureIds() {
  let max = 0;
  tasks.forEach(t => { if (t.id > max) max = t.id; });
  tasks.forEach(t => { if (!t.id) t.id = ++max; });
  nextId = max + 1;
}
ensureIds();

let justAdded = null;
let editId = null;
const collapsed = new Set();

function save() { store.set("tasks", JSON.stringify(tasks)); }
const snapshot = () => tasks.map(t => ({ ...t }));

// ---------- theme (follows the device until you choose) ----------
const mq = window.matchMedia("(prefers-color-scheme: dark)");
function applyTheme() {
  const saved = store.get("theme");
  const dark = saved ? saved === "dark" : mq.matches;
  document.body.classList.toggle("dark", dark);
  $("themeBtn").textContent = dark ? "☀️" : "🌙";
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = dark ? "#0f172a" : "#4f46e5";
}
$("themeBtn").onclick = () => {
  store.set("theme", document.body.classList.contains("dark") ? "light" : "dark");
  applyTheme();
};
if (mq.addEventListener) mq.addEventListener("change", applyTheme);
applyTheme();

// ---------- dates ----------
const ISO = /^\d{4}-\d{2}-\d{2}$/;
function todayStr() {
  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}
function parseDate(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function dayDiff(s) {
  const t = new Date();
  return Math.round((parseDate(s) - new Date(t.getFullYear(), t.getMonth(), t.getDate())) / 864e5);
}
function friendly(s) {
  if (!s) return "";
  if (!ISO.test(s)) return s;
  const n = dayDiff(s);
  if (n === 0) return "Today";
  if (n === 1) return "Tomorrow";
  if (n === -1) return "Yesterday";
  const dt = parseDate(s);
  const opts = { weekday: "short", day: "numeric", month: "short", year: "numeric" };
  return dt.toLocaleDateString(undefined, opts);
}

// ---------- helpers ----------
function withTransition(fn) {
  if (document.startViewTransition && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    document.startViewTransition(fn);
  } else {
    fn();
  }
}

let toastTimer = null;
function showToast(msg, prev) {
  $("toastMsg").textContent = msg;
  $("toast").hidden = false;
  // re-trigger the entrance animation
  $("toast").style.animation = "none"; void $("toast").offsetWidth; $("toast").style.animation = "";
  $("toastUndo").onclick = () => {
    tasks = prev;
    ensureIds();
    save();
    hideToast();
    withTransition(render);
  };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 6000);
}
function hideToast() { clearTimeout(toastTimer); $("toast").hidden = true; }

function removeTask(id) {
  const prev = snapshot();
  tasks = tasks.filter(t => t.id !== id);
  save();
  render();
  showToast("Task deleted", prev);
}

function openEdit(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  editId = id;
  $("eItem").value = t.item;
  $("ePriority").value = t.priority;
  $("eDeadline").value = t.deadline || "";
  syncDates();
  $("eRequestedBy").value = t.requestedBy || "";
  $("eNotes").value = t.notes || "";
  $("editDialog").showModal();
}

// ---------- render ----------
const rank = { High: 0, Medium: 1, Low: 2 };

function groupOf(t, mode) {
  if (t.done) return ["9", "Done"];
  if (mode === "due") {
    if (!t.deadline || !ISO.test(t.deadline)) return ["5", "No deadline"];
    const n = dayDiff(t.deadline);
    if (n < 0) return ["1", "Overdue"];
    if (n === 0) return ["2", "Today"];
    if (n <= 7) return ["3", "Next 7 days"];
    return ["4", "Later"];
  }
  const name = (t.requestedBy || "").trim();
  return name ? ["0" + name.toLowerCase(), name] : ["8", "Unassigned"];
}

function buildRow(t) {
  const today = todayStr();
  const tr = document.createElement("tr");
  tr.style.viewTransitionName = "t" + t.id;
  if (t.done) tr.className = "done";
  if (t.id === justAdded) tr.classList.add("enter");
  tr.ondblclick = e => { if (!e.target.closest("button, input")) openEdit(t.id); };

  // done checkbox
  const doneTd = document.createElement("td");
  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.checked = !!t.done;
  cb.setAttribute("aria-label", "Done");
  cb.onchange = () => withTransition(() => { t.done = cb.checked; save(); render(); });
  doneTd.appendChild(cb);
  tr.appendChild(doneTd);

  // item + notes
  const itemTd = document.createElement("td");
  itemTd.appendChild(document.createTextNode(t.item));
  if (t.notes) {
    const n = document.createElement("div");
    n.className = "notes";
    n.textContent = t.notes;
    itemTd.appendChild(n);
  }
  tr.appendChild(itemTd);

  // priority
  const prTd = document.createElement("td");
  const badge = document.createElement("span");
  badge.className = "badge " + t.priority;
  badge.textContent = t.priority;
  prTd.appendChild(badge);
  tr.appendChild(prTd);

  // deadline
  const dlTd = document.createElement("td");
  if (t.deadline) {
    let text = friendly(t.deadline);
    if (!t.done && ISO.test(t.deadline)) {
      if (t.deadline < today) { dlTd.className = "overdue"; text += " · overdue"; }
      else if (t.deadline === today) dlTd.className = "today";
    }
    dlTd.textContent = text;
  }
  tr.appendChild(dlTd);

  // requested by
  const rbTd = document.createElement("td");
  rbTd.textContent = t.requestedBy || "";
  tr.appendChild(rbTd);

  // actions
  const actTd = document.createElement("td");
  const editBtn = document.createElement("button");
  editBtn.textContent = "✏️";
  editBtn.title = "Edit";
  editBtn.onclick = () => openEdit(t.id);
  const delBtn = document.createElement("button");
  delBtn.textContent = "🗑️";
  delBtn.title = "Delete";
  delBtn.onclick = () => removeTask(t.id);
  actTd.append(editBtn, delBtn);
  tr.appendChild(actTd);
  return tr;
}

function render() {
  const list = $("list");
  list.innerHTML = "";

  const q = $("search").value.trim().toLowerCase();
  const fp = $("filterPriority").value;
  const fs = $("filterStatus").value;
  const sortBy = $("sortBy").value;
  const groupBy = $("groupBy").value;

  // stats + progress (always for all tasks)
  const total = tasks.length;
  const doneCount = tasks.filter(t => t.done).length;
  $("statText").textContent = total ? doneCount + " of " + total + " done" : "No tasks yet";
  $("barFill").style.width = total ? Math.round(doneCount / total * 100) + "%" : "0";
  $("clearDone").hidden = doneCount === 0;

  // requester suggestions
  const names = [...new Set(tasks.map(t => (t.requestedBy || "").trim()).filter(Boolean))].sort();
  $("people").innerHTML = "";
  names.forEach(n => { const o = document.createElement("option"); o.value = n; $("people").appendChild(o); });

  // filter + sort
  const items = tasks.map((t, i) => ({ t, i })).filter(({ t }) => {
    if (q && !((t.item || "") + " " + (t.notes || "") + " " + (t.requestedBy || "")).toLowerCase().includes(q)) return false;
    if (fp && t.priority !== fp) return false;
    if (fs === "open" && t.done) return false;
    if (fs === "done" && !t.done) return false;
    return true;
  });
  const dl = (a, b) => {
    if (a === b) return 0;
    if (!a) return 1;
    if (!b) return -1;
    return a < b ? -1 : 1;
  };
  items.sort((x, y) => {
    const A = x.t, B = y.t;
    if (!!A.done !== !!B.done) return A.done ? 1 : -1;
    if (sortBy === "deadline") return dl(A.deadline, B.deadline) || rank[A.priority] - rank[B.priority] || x.i - y.i;
    if (sortBy === "priority") return rank[A.priority] - rank[B.priority] || dl(A.deadline, B.deadline) || x.i - y.i;
    return x.i - y.i;
  });

  // empty states
  const empty = $("empty");
  $("table").hidden = items.length === 0;
  empty.hidden = items.length > 0;
  if (total === 0) empty.innerHTML = "<b>Nothing to do 🎉</b>Add your first task above.";
  else if (items.length === 0) empty.innerHTML = "<b>No matching tasks</b>Try changing the search or filters.";

  // rows (optionally grouped)
  if (groupBy === "none") {
    items.forEach(({ t }) => list.appendChild(buildRow(t)));
  } else {
    const groups = new Map();
    items.forEach(({ t }) => {
      const [key, label] = groupOf(t, groupBy);
      if (!groups.has(key)) groups.set(key, { label, items: [] });
      groups.get(key).items.push(t);
    });
    [...groups.entries()].sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0).forEach(([key, g]) => {
      const tr = document.createElement("tr");
      tr.className = "group" + (key === "1" ? " overdue" : "");
      const td = document.createElement("td");
      td.colSpan = 6;
      const isCollapsed = collapsed.has(g.label);
      td.textContent = (isCollapsed ? "▸ " : "▾ ") + g.label + " · " + g.items.length;
      tr.onclick = () => { isCollapsed ? collapsed.delete(g.label) : collapsed.add(g.label); render(); };
      tr.appendChild(td);
      list.appendChild(tr);
      if (!isCollapsed) g.items.forEach(t => list.appendChild(buildRow(t)));
    });
  }
  justAdded = null;
}

// ---------- add / edit ----------
// Show dates like "21 Nov 2026" in the date fields (native picker still used)
function syncDates() {
  document.querySelectorAll(".dwrap").forEach(w => {
    const inp = w.querySelector("input"), sp = w.querySelector(".dfmt");
    const ok = ISO.test(inp.value);
    sp.textContent = ok
      ? parseDate(inp.value).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" })
      : "Pick a date";
    sp.classList.toggle("empty", !ok);
  });
}
document.querySelectorAll("input[type=date]").forEach(inp => {
  const w = document.createElement("div");
  w.className = "dwrap";
  inp.parentNode.insertBefore(w, inp);
  w.appendChild(inp);
  w.insertAdjacentHTML("beforeend", '<span class="dfmt" aria-hidden="true"></span>');
  inp.addEventListener("input", syncDates);
  inp.addEventListener("change", syncDates);
});
$("deadline").value = todayStr();
syncDates();
$("form").onsubmit = e => {
  e.preventDefault();
  const task = {
    id: nextId++,
    item: $("item").value.trim(),
    priority: $("priority").value,
    deadline: $("deadline").value,
    requestedBy: $("requestedBy").value.trim(),
    notes: $("notes").value.trim(),
    done: false
  };
  if (!task.item) return;
  tasks.push(task);
  justAdded = task.id;
  save();
  render();
  e.target.reset();
  $("deadline").value = todayStr();
  syncDates();
  if (matchMedia("(hover: hover)").matches) $("item").focus();
};

$("editForm").onsubmit = e => {
  e.preventDefault();
  const t = tasks.find(x => x.id === editId);
  if (t && $("eItem").value.trim()) {
    t.item = $("eItem").value.trim();
    t.priority = $("ePriority").value;
    t.deadline = $("eDeadline").value;
    t.requestedBy = $("eRequestedBy").value.trim();
    t.notes = $("eNotes").value.trim();
    save();
    render();
  }
  $("editDialog").close();
};
$("eCancel").onclick = () => $("editDialog").close();
$("editDialog").addEventListener("click", e => { if (e.target === $("editDialog")) $("editDialog").close(); });

// ---------- clear completed ----------
$("clearDone").onclick = () => {
  const n = tasks.filter(t => t.done).length;
  if (!n) return;
  const prev = snapshot();
  tasks = tasks.filter(t => !t.done);
  save();
  render();
  showToast("Cleared " + n + " completed task" + (n > 1 ? "s" : ""), prev);
};

// ---------- search / filter / sort / group ----------
$("sortBy").value = store.get("sortBy") || "deadline";
$("groupBy").value = store.get("groupBy") || "none";
document.querySelectorAll(".chips").forEach(g => {
  g.addEventListener("click", e => {
    const b = e.target.closest(".chip");
    if (!b) return;
    $(g.dataset.for).value = b.dataset.v;
    g.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c === b));
    render();
  });
});
["search", "sortBy", "groupBy"].forEach(id => {
  $(id).addEventListener("input", () => {
    if (id === "sortBy" || id === "groupBy") store.set(id, $(id).value);
    render();
  });
});

// ---------- keyboard shortcuts ----------
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "Escape" && e.target === $("search")) {
    $("search").value = "";
    $("search").blur();
    render();
    return;
  }
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "select" || tag === "textarea" || $("editDialog").open) return;
  if (e.key === "/") { e.preventDefault(); $("search").focus(); }
  else if (e.key === "n" || e.key === "N") { e.preventDefault(); $("item").focus(); }
});

// ---------- export / import ----------
$("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify(tasks, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "todo-backup-" + todayStr() + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
};
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = e => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!Array.isArray(data) || !data.every(t => t && typeof t.item === "string")) throw new Error("bad format");
      if (!confirm("Replace your current " + tasks.length + " task(s) with " + data.length + " task(s) from this file?")) return;
      tasks = data.map(t => ({
        item: t.item,
        priority: ["High", "Medium", "Low"].includes(t.priority) ? t.priority : "Medium",
        deadline: typeof t.deadline === "string" ? t.deadline : "",
        requestedBy: typeof t.requestedBy === "string" ? t.requestedBy : "",
        notes: typeof t.notes === "string" ? t.notes : "",
        done: !!t.done
      }));
      ensureIds();
      save();
      render();
    } catch (err) {
      alert("Sorry, that file isn't a valid backup.");
    }
  };
  reader.readAsText(file);
};

// ---------- offline / install (works when served over https or localhost) ----------
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

// ---------- demo mode for screenshots/mockups: index.html?demo[&theme=dark][&scroll] ----------
// Only fills in sample tasks when the list is empty; nothing is saved until you change something.
(function () {
  const p = new URLSearchParams(location.search);
  if (!p.has("demo")) return;
  if (!tasks.length) {
    const d = n => { const x = new Date(); x.setDate(x.getDate() + n); return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); };
    tasks = [
      { item: "Send Q3 report to finance", priority: "High", deadline: d(-2), requestedBy: "Sarah", notes: "Include revenue summary", done: false },
      { item: "Call vendor about invoice", priority: "Medium", deadline: d(0), requestedBy: "Bob", notes: "", done: false },
      { item: "Book flights for offsite", priority: "High", deadline: d(3), requestedBy: "Priya", notes: "", done: false },
      { item: "Review design mockups", priority: "Medium", deadline: d(5), requestedBy: "Sarah", notes: "", done: false },
      { item: "Renew passport", priority: "Low", deadline: d(40), requestedBy: "", notes: "", done: false },
      { item: "Buy milk", priority: "Low", deadline: "", requestedBy: "", notes: "", done: true }
    ];
    ensureIds();
  }
  if (p.get("theme")) document.body.classList.toggle("dark", p.get("theme") === "dark");
  if (p.has("scroll")) setTimeout(() => window.scrollTo(0, $("table").offsetTop - 70), 100);
})();

render();
</script>
