<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do Tracker – iPhone 14 Pro Max mockup</title>
<style>
  body {
    margin: 0;
    padding: 40px 20px;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #e5e7eb;
    color: #334155;
  }
  h1 { text-align: center; font-size: 1.3em; margin: 0 0 4px; }
  p.sub { text-align: center; margin: 0 0 32px; color: #64748b; font-size: 0.9em; }
  .row { display: flex; gap: 48px; justify-content: center; flex-wrap: wrap; }
  figure { margin: 0; text-align: center; }
  figcaption { margin-top: 14px; font-size: 0.9em; color: #64748b; }

  /* iPhone 14 Pro Max: 430 x 932 pt screen */
  .phone {
    position: relative;
    width: 430px;
    height: 932px;
    padding: 14px;
    box-sizing: content-box;
    border-radius: 68px;
    background: #1c1c1e;
    box-shadow: inset 0 0 0 3px #3a3a3c, 0 30px 60px rgba(15, 23, 42, 0.35);
    zoom: 0.78;
  }
  /* side buttons */
  .phone::before, .phone::after {
    content: ""; position: absolute; width: 5px; background: #2c2c2e; border-radius: 3px;
  }
  .phone::before { left: -5px; top: 170px; height: 60px; box-shadow: 0 90px 0 #2c2c2e, 0 -60px 0 -1px #2c2c2e; }
  .phone::after { right: -5px; top: 250px; height: 100px; }

  .screen {
    position: relative;
    width: 430px;
    height: 932px;
    border-radius: 55px;
    overflow: hidden;
    background: #fff;
  }
  .screen.dark { background: #0f172a; }
  iframe { position: absolute; top: 54px; left: 0; width: 430px; height: 844px; border: 0; background: transparent; }

  /* status bar */
  .status {
    position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 2;
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 34px 0 44px; box-sizing: border-box;
    font-weight: 600; font-size: 17px; color: #0f172a;
  }
  .screen.dark .status { color: #fff; }
  .status .right { display: flex; gap: 6px; align-items: center; }
  .status svg { display: block; fill: currentColor; }
  .island {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 126px; height: 36px; background: #000; border-radius: 20px; z-index: 3;
  }
  .home-bar {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 140px; height: 5px; border-radius: 3px; background: #0f172a; z-index: 3; opacity: .85;
  }
  .screen.dark .home-bar { background: #fff; }
</style>
</head>
<body>
<h1>To-Do Tracker on iPhone 14 Pro Max</h1>
<p class="sub">Light and dark mode · live app inside a 430 × 932 device frame (sample data)</p>

<div class="row">

  <figure>
    <div class="phone"><div class="screen">
      <div class="status"><span>9:41</span><span class="right">
        <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2.3c2.3 0 4.4.9 6 2.4l1.1-1.2A10.7 10.7 0 0 0 8.5.6C5.700.6 3.200 1.700 1.400 3.500l1.100 1.200a8.900 8.900 0 0 1 6-2.400zm0 3.700c1.300 0 2.500.5 3.400 1.300l1.100-1.200A7 7 0 0 0 8.500 4.400c-1.800 0-3.500.7-4.700 1.800l1.100 1.200c.9-.8 2.100-1.400 3.600-1.400zm0 3.600c.6 0 1.100.2 1.500.6L8.500 12 7 10.200c.4-.4.900-.6 1.500-.6z"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.500" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2"/><rect x="25" y="4.500" width="2" height="4" rx="1" opacity=".4"/></svg>
      </span></div>
      <div class="island"></div>
      <iframe src="index.html?demo&scroll" title="App – light, task list"></iframe>
      <div class="home-bar"></div>
    </div></div>
    <figcaption>Light mode</figcaption>
  </figure>

  <figure>
    <div class="phone"><div class="screen dark">
      <div class="status"><span>9:41</span><span class="right">
        <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2.3c2.3 0 4.4.9 6 2.4l1.1-1.2A10.7 10.7 0 0 0 8.5.6C5.700.6 3.200 1.700 1.400 3.500l1.100 1.200a8.900 8.900 0 0 1 6-2.400zm0 3.700c1.300 0 2.500.5 3.400 1.300l1.100-1.200A7 7 0 0 0 8.500 4.400c-1.800 0-3.500.7-4.700 1.800l1.100 1.200c.9-.8 2.100-1.400 3.600-1.400zm0 3.600c.6 0 1.100.2 1.500.6L8.500 12 7 10.200c.4-.4.900-.6 1.500-.6z"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.500" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2"/><rect x="25" y="4.500" width="2" height="4" rx="1" opacity=".4"/></svg>
      </span></div>
      <div class="island"></div>
      <iframe src="index.html?demo&theme=dark&scroll" title="App – dark, task list"></iframe>
      <div class="home-bar"></div>
    </div></div>
    <figcaption>Dark mode</figcaption>
  </figure>
</div>
</body>
</html>
